version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'composer'
    directory: '/test-service'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'
